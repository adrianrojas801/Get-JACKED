<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Jacked</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Get Jacked">
<meta name="theme-color" content="#1d5e40">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header><div class="brand"><h1>Get Jacked</h1><div id="hsub"></div></div><div class="hright"><button id="me" type="button" aria-label="Account and data">?</button><span id="status">Connecting…</span></div></header>
<div id="auth"></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="timer"><b id="tleft">0:00</b><button class="small" data-t="-15">−15</button><button class="small" data-t="15">+15</button><button class="small" data-t="stop">Done</button></div>
<nav id="nav">
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4z"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</button>
  <button data-tab="workout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 7-7"/></svg>Progress</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Plan</button>
</nav>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<!-- The app, in load order. Each file says what it holds at the top. -->
<script src="js/program.js"></script>
<script src="js/core.js"></script>
<script src="js/training.js"></script>
<script src="js/shared.js"></script>
<script src="js/today.js"></script>
<script src="js/workout.js"></script>
<script src="js/progress.js"></script>
<script src="js/plan.js"></script>
<script src="js/events.js"></script>
<script src="js/app.js"></script>
</body>
</html>
