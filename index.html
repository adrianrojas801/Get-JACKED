<style>
/* Calm forest-green training log: soft tinted neutrals, floating cards, one green accent, frosted header + tab bar */
:root{
  --bg:#eef3ef;--card:#ffffff;--field:#f5f8f6;--text:#123d2a;--muted:#4a7a60;--line:#dde6e0;--chip:#e6efe9;
  --accent:#1d5e40;--accent-soft:#dcebe2;--good:#119a63;--warn:#a86400;--bad:#c0392b;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 4px 16px rgba(20,40,30,.06);
  --glass:rgba(255,255,255,.78);--r:16px;--r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1310;--card:#151d19;--field:#1a241f;--text:#c4ead5;--muted:#6fa287;--line:#25322b;--chip:#1e2a24;
  --accent:#34b37a;--accent-soft:#1c3328;--good:#5fd69c;--warn:#e0a040;--bad:#ef6b5b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--glass:rgba(21,29,25,.78);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1310;--card:#151d19;--field:#1a241f;--text:#c4ead5;--muted:#6fa287;--line:#25322b;--chip:#1e2a24;
  --accent:#34b37a;--accent-soft:#1c3328;--good:#5fd69c;--warn:#e0a040;--bad:#ef6b5b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--glass:rgba(21,29,25,.78);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 var(--font);background:var(--bg);color:var(--text);padding-bottom:170px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:4;padding:12px max(16px,calc((100% - 612px)/2)) 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
#hsub{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:"Big Shoulders Display","Arial Narrow",var(--font);font-size:28px;margin:0;font-weight:800;letter-spacing:.015em;color:var(--accent);line-height:.85;text-transform:uppercase}
.hright{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.hright #status{font-size:11px;white-space:nowrap}
#me{width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
#me.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
.backrow{display:flex;align-items:center;gap:10px;margin:4px 0 0}
#status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
#status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--accent-soft);transition:background .2s}
#status.busy::before{background:var(--muted)}
#status.off::before{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 18%,transparent)}
main{padding:16px 14px 0;max-width:640px;margin:0 auto}
main.enter>*{animation:rise .32s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.03s}main.enter>*:nth-child(3){animation-delay:.06s}main.enter>*:nth-child(4){animation-delay:.09s}main.enter>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 10px;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.card h3{font-size:11.5px;margin:16px 0 8px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;align-items:center}
.row h3{margin:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:5px;font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.65}
/* Browser autofill paints filled fields light blue. Paint over it with the theme's field color instead. */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);caret-color:var(--text);-webkit-box-shadow:0 0 0 1000px var(--field) inset;box-shadow:0 0 0 1000px var(--field) inset;transition:background-color 99999s ease-out 0s}
input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--card) inset,0 0 0 3px var(--accent-soft);box-shadow:0 0 0 1000px var(--card) inset,0 0 0 3px var(--accent-soft)}
input:autofill{background:var(--field);color:var(--text)}
/* Chrome on iPhone fills sign-in fields by setting an inline light-blue background (#E8F0FE), which beats normal CSS. !important wins over it. */
#auth input,input[type=email],input[type=password],input[autocomplete]{background-color:var(--field)!important;color:var(--text)!important;-webkit-text-fill-color:var(--text)}
#auth input:focus,input[type=email]:focus,input[type=password]:focus,input[autocomplete]:focus{background-color:var(--card)!important}
textarea{min-height:64px;resize:vertical}
input[type=date],select{height:42px;line-height:normal;display:block}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.wsel{align-items:end;column-gap:10px}
button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;transition:transform .12s var(--ease),background .15s,border-color .15s,color .15s,box-shadow .15s;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:600;box-shadow:0 2px 8px rgba(29,94,64,.22)}
button.small{padding:5px 11px;font-size:13px;border-radius:8px}
button.link{background:none;border:none;color:var(--accent);padding:4px 2px;font-weight:600;box-shadow:none}
button[data-act="day"]{width:38px;height:38px;padding:0;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:12px;color:var(--muted)}
label.btn{display:inline-block;border:1px solid var(--line);background:var(--chip);border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;font-weight:500}
.handle{touch-action:none;cursor:grab;padding:6px 10px;font-size:22px;line-height:1;color:var(--muted);user-select:none;-webkit-user-select:none}
.ritem{transition:background .15s}
.ritem.dragging{background:var(--card);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.snapimg{width:48px;height:48px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.snaprow{display:grid;grid-template-columns:1fr 64px 56px 44px 32px;gap:4px;align-items:center;margin-top:6px}
.snaprow input{padding:6px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.bar>div{height:100%;background:var(--accent);border-radius:999px;transition:width .5s var(--ease)}
.bar.done>div{background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:13px;padding:8px 11px;text-align:left;background:var(--field);border-radius:12px;line-height:1.3}
.chips button .muted{font-size:12px}
.chips{padding-top:4px}
.chips button{position:relative;transition:transform .12s var(--ease),background .25s,border-color .25s,box-shadow .15s}
.chips button.has{border-color:var(--good);background:var(--accent-soft)}
.qn{position:absolute;top:-8px;right:-7px;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--good);color:var(--card);font-size:11.5px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:none}
.chips button.has .qn{display:inline-flex}
.qn.pop{animation:pop .38s var(--ease)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.chips button.ring{animation:ring .55s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.qlist li{padding:8px 0}.qlist button.small{min-width:36px;padding:6px 0}.qlist button.qx{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.list li.pop{animation:rowin .9s ease-out;border-radius:8px}
@keyframes rowin{0%{background:var(--accent-soft)}100%{background:transparent}}
#toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(72px + max(24px,env(safe-area-inset-bottom)));background:var(--good);color:var(--card);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .25s var(--ease);pointer-events:none;z-index:7;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto;z-index:9}
#undo{margin-left:12px;padding:3px 10px;border-radius:999px;background:var(--card);color:var(--good);border:none;font-weight:700;font-size:13px}
.sheet{position:fixed;left:0;right:0;bottom:0;top:max(44px,env(safe-area-inset-top));z-index:8;background:var(--bg);border-radius:20px 20px 0 0;border-top:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.35);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(28px + env(safe-area-inset-bottom));animation:sheetup .28s var(--ease) both}
@keyframes sheetup{from{transform:translateY(40px);opacity:.001}to{transform:none;opacity:1}}
.sheet>*{max-width:612px;margin-left:auto;margin-right:auto}
.sheethead{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 10px;background:var(--bg)}
.sheethead h2{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.025em;margin:0;line-height:1}
.sheet h3{font-size:11.5px;margin:18px 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
body.sheeton{overflow:hidden}body.sheeton #timer{display:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:none}
.grow{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;-webkit-appearance:none;appearance:none;padding:0;margin:0;border:2px solid var(--accent);border-radius:7px;background:var(--accent-soft);display:grid;place-content:center;cursor:pointer;box-shadow:none}
.check input:checked{background:var(--good);border-color:var(--good)}
.check input:checked::after{content:'';width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:middle}
.hint{font-size:13px;margin-top:4px}
.banner{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px;margin:12px 0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:6px 10px max(24px,env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;border-radius:12px;padding:7px 0 6px;font-size:11.5px;font-weight:600;color:var(--muted);box-shadow:none}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);background:var(--accent-soft)}
#timer{position:fixed;left:10px;right:10px;bottom:calc(66px + max(24px,env(safe-area-inset-bottom)));background:var(--text);color:var(--bg);border-radius:var(--r);padding:10px 12px 10px 16px;display:none;align-items:center;gap:8px;z-index:6;max-width:620px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#timer.show{display:flex;animation:rise .25s var(--ease)}
#timer b{font-size:24px;font-variant-numeric:tabular-nums;flex:1;letter-spacing:-.01em}
#timer button{background:transparent;color:var(--bg);border-color:var(--muted)}
#timer.over{background:var(--good);color:var(--card)}
#timer.over button{color:var(--card)}
table.simple{width:100%;border-collapse:collapse;font-size:14px}
table.simple td,table.simple th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
table.simple th{font-size:11.5px;color:var(--muted);font-weight:650;border-top:none;text-transform:uppercase;letter-spacing:.05em}
ul.plain{margin:4px 0;padding-left:18px}
ul.plain li{margin:5px 0}
/* Athletic display type: condensed uppercase for headings, big numbers and actions; body copy stays system */
:root{--display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",var(--font)}
h1{font-family:var(--display)}
.card h2{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.025em;line-height:1}
.card h3{letter-spacing:.1em;font-weight:700}
main>.row.between>b{font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
main>.row.between>div>b{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.025em;line-height:1}
.card>.row.between>.grow>b{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.025em;line-height:1.05}
.card .row.between>span>b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.01em}
.kpi b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.01em;line-height:1.05}
.kpi span{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:600}
table.simple th{letter-spacing:.08em}
#timer b{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:.02em}
button.primary{text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:13.5px}
button.primary.small{font-size:12px;white-space:nowrap;flex:none}
nav button{text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;font-weight:700}
.ico{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2.5px;margin-right:6px}
label.btn{display:inline-flex;align-items:center;font-size:14px}
label.btn .ico{width:20px;height:20px;stroke-width:1.9;margin-right:7px;vertical-align:0}
:root{--body:#e3eae5;--mus:#cdd7d0;--hot:#e0483c;--hot2:#ec8a80;--hot1:#f4c6c0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--body:#1d2822;--mus:#2e3c35;--hot:#ff5f52;--hot2:#c4554c;--hot1:#6a3934}}
:root[data-theme="dark"]{--body:#1d2822;--mus:#2e3c35;--hot:#ff5f52;--hot2:#c4554c;--hot1:#6a3934}
.mfig{width:66px;height:72px;flex:none}

.mcard{display:flex;gap:14px;align-items:center}

.mcard h3{color:var(--accent)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}

ol.plain{margin:4px 0}ol.plain li{margin:6px 0}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--chip);border-radius:14px;margin:4px 0 12px}
.seg button{border:none;background:none;box-shadow:none;border-radius:10px;padding:9px 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.setrow button{padding:9px 0}

function calcTargets(p){

}

// How much to add when it's time to go up: the exercise's own "jump" if set in the program,
// otherwise 10 lbs on the Smith (a 5 on each side) and 5 lbs on everything else.
const jumpFor=ex=>num(ex.inc)>0?num(ex.inc):(/smith/i.test(ex.n)?10:5);
const repRange=ex=>{const m=String(ex.r||'').match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:[8,12]};
// What to aim for today, one {w,r} per set, or null with no history.
//  - hit the top of the range on every set last time: add the jump and start again at the bottom of the range
//  - stalled: about 10% off, top of the range

function targetFor(last,ex,stall){
  if(!last)return null;
  const [lo,hi]=repRange(ex),n=ex.sets?ex.sets.length:ex.s;
  const base=Array.from({length:n},(_,j)=>last.sets[Math.min(j,last.sets.length-1)]);
  const top=Math.max(...last.sets.map(s=>num(s.w)||0));
  const all=last.sets.length>=ex.s&&last.sets.every(s=>num(s.r)>=hi);
  if(all)return base.map(()=>({w:top+jumpFor(ex),r:lo}));
  if(stall&&top>0)return base.map(()=>({w:Math.round(top*0.9/5)*5,r:hi}));
  let bumped=false;
  return base.map(s=>{let r=num(s.r);if(!bumped&&r<hi){r++;bumped=true}return {w:num(s.w)||0,r}});
}

// ---------- lift stats (shared by the workout hints, finish summary, Progress and records) ----------
const setsDone=e=>(e.sets||[]).filter(s=>s.d&&num(s.r));

function bestSet(e){
  const sets=setsDone(e),wt=sets.filter(s=>num(s.w)>0);let b=null;
  for(const s of (wt.length?wt:sets)){const W=num(s.w)||0,R=num(s.r),v=W?e1rm(W,R):R;if(!b||v>b.v)b={v,bw:!W,top:`${W||'BW'}×${R}`}}

}
// One entry per session the lift was done in, oldest first: {id,date,v,bw,top}.
// Once a lift has weighted sessions, bodyweight-only ones are left out so the numbers stay comparable.
function liftHistory(name,upTo,excludeId){
  const out=[];
  for(const [id,w] of Object.entries(S.workouts)){
    if(!w||id===excludeId||(upTo&&w.date>upTo))continue;
    let b=null;for(const e of w.ex||[])if(e.n===name){const x=bestSet(e);if(x&&(!b||x.v>b.v))b=x}
    if(b)out.push(Object.assign({id,date:w.date},b));

}
const bestOf=hist=>hist.reduce((m,x)=>!m||x.v>m.v?x:m,null);

function stallOf(hist){

// ---------- charts ----------
function chart(series,{h=150,goal=null,xl=null,yf=v=>Math.round(v)}={}){
  const all=series.flatMap(s=>s.pts);if(all.length<2)return '<p class="muted">Log a few more entries to see a chart.</p>';
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);if(goal!=null)ys.push(goal);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+1;
  let y0=Math.min(...ys),y1=Math.max(...ys);const py=(y1-y0)*0.12||1;y0-=py;y1+=py;
  const W=320,H=h,L=36,R=8,Tp=8,B=xl?18:8;
  const X=x=>(L+(x-x0)/(x1-x0)*(W-L-R)).toFixed(1),Y=y=>(Tp+(1-(y-y0)/(y1-y0))*(H-Tp-B)).toFixed(1);
  let g='';
  for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${+Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${yf(v)}</text>`}
  if(goal!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--good)" stroke-dasharray="4 3"/><text x="${W-R}" y="${+Y(goal)-3}" text-anchor="end" font-size="10" fill="var(--good)">goal ${goal}</text>`;
  for(const s of series){
    if(!s.pts.length)continue;
    if(s.dots)g+=s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" fill="${s.color}" opacity=".55"/>`).join('');
    else g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`+(s.pts.length<15?s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${s.color}"/>`).join(''):'');
  }
  if(xl)g+=`<text x="${L}" y="${H-4}" font-size="10" fill="var(--muted)">${esc(xl[0])}</text><text x="${W-R}" y="${H-4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(xl[1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="chart">${g}</svg>`;
}

function foodTotals(d){let c=0,p=0;for(const f of d.food||[]){c+=(f.c||0)*(f.q||1);p+=(f.p||0)*(f.q||1)}return {c,p}}
function bar(v,t){const pct=Math.min(100,Math.round(v/t*100));return `<div class="bar ${v>=t?'done':''}"><div style="width:${pct}%"></div></div>`}

// ---------- food log ----------
const sameFood=(f,p)=>f.n===p.n&&f.c===(+p.c||0)&&f.p===(+p.p||0);
// Adds q of a food to a day (bumps the count if it's already there). Every way of logging food goes through here.
// A new entry also notes the hour (h) when it's logged on the day itself, so topFoods() can learn what you eat when.
function addFood(d,p,q=1){const n=String(p.n).trim(),x={n,c:+p.c||0,p:+p.p||0};const ex=d.food.find(f=>sameFood(f,x));if(ex)ex.q=(ex.q||1)+q;else{const h=p.h!=null?p.h:(d.date===today()?new Date().getHours():null);d.food.push(Object.assign(x,{q},h!=null?{h}:{}))}return d}
// Foods logged in the last 3 weeks that aren't quick-add buttons yet, newest first.
function recentFoods(k){
  const ps=presets(),out=[];
  for(let i=1;i<=21&&out.length<8;i++)for(const f of (S.days[addDays(k,-i)]||{}).food||[])
    if(out.length<8&&!ps.some(p=>sameFood(f,p))&&!out.some(o=>sameFood(f,o)))out.push({n:f.n,c:f.c,p:f.p});
  return out;
}
// One quick-add food that closes the most of the protein gap without blowing the calories left.
function proteinIdea(d,t){
  const tot=foodTotals(d),gap=t.pro-tot.p,left=t.cal-tot.c;if(gap<15)return '';
  const fits=presets().filter(p=>p.p>=8&&p.c<=Math.max(left,0)+200);if(!fits.length)return '';
  const pick=fits.sort((a,b)=>Math.min(b.p,gap)-Math.min(a.p,gap)||a.c-b.c)[0];
  return `<div class="muted" style="margin-top:4px">Idea: ${esc(pick.n)} gets you ${fmt(Math.min(pick.p,gap))} g closer for ${fmt(pick.c)} cal.</div>`;
}
function pq(d,p){return ((d.food||[]).find(f=>sameFood(f,p))||{}).q||0}
function foodSum(d,t){const tot=foodTotals(d);return `<div class="fsum"><div class="muted">${tot.p>=t.pro?'<span class="good">Protein hit ✓</span>':`${fmt(t.pro-tot.p)} g protein to go`} · ${tot.c>=t.cal?'calories hit':fmt(t.cal-tot.c)+' cal left'}</div>${S.dk===today()?proteinIdea(d,t):''}</div>`}
function foodLog(d){return `<div id="flog">${(d.food||[]).length?`<h3>Logged</h3><ul class="list">`+d.food.map((f,i)=>`<li data-fn="${esc(f.n)}"><div class="grow">${esc(f.n)}${(f.q||1)>1?` <b>×${f.q}</b>`:''}<div class="muted">${fmt(f.c*(f.q||1))} cal · ${r1(f.p*(f.q||1))} g</div></div><button class="small" data-act="fq" data-i="${i}" data-v="-1">−</button><button class="small" data-act="fq" data-i="${i}" data-v="1">+</button></li>`).join('')+`</ul>`:''}</div>`}
// The foods you log most, with the ones you usually eat around this time of day first. Quick-add foods fill any gaps.
// Only earlier days count, so the buttons don't move while you're logging.
function topFoods(k,n=6){
  const hr=new Date().getHours(),score=new Map();
  for(let i=1;i<=30;i++)for(const f of (S.days[addDays(k,-i)]||{}).food||[]){
    const key=f.n+'|'+f.c+'|'+f.p,gap=f.h==null?99:Math.abs(f.h-hr),near=Math.min(gap,24-gap)<=3;
    const e=score.get(key)||{f:{n:f.n,c:f.c,p:f.p},s:0};e.s+=(near?3:1)*(i<=7?2:1);score.set(key,e)}
  const out=[...score.values()].sort((x,y)=>y.s-x.s||x.f.n.localeCompare(y.f.n)).map(e=>e.f);
  for(const p of presets()){if(out.length>=n)break;const x={n:p.n,c:+p.c||0,p:+p.p||0};if(!out.some(o=>sameFood(o,x)))out.push(x)}
  return out.slice(0,n);
}

- For chain restaurant orders, use the chain's published nutrition numbers. For build-your-own places (Cava, Sweetgreen, Chipotle), add up the published numbers for each listed component (base, each protein scoop, dips, toppings, dressing) and return the bowl as one item. Don't hedge about published numbers; only mention uncertainty when a portion or ingredient isn't visible or listed.
- For a nutrition label, use the per-serving numbers; assume 1 serving unless his note says otherwise.
- For home food, estimate typical portions from what's visible. Count tortillas individually.
- c is calories for ONE unit, p is protein grams for ONE unit, q is how many units.
- Reply with only JSON in this shape: {"items":[{"n":"short name","c":60,"p":1.5,"q":6}],"note":"one short sentence, only if something was assumed"}
- If there is no food or nutrition info, reply {"items":[],"note":"short reason"}.`;
  try{
    const opts={};if(S.snapFile)opts.images=[S.snapFile];

  }catch(e){
    const c=e&&e.code;
    const m={not_granted:'Claude access was declined for this page.',rate_limited:'Usage limit reached or too many requests. Try again later.',image_rejected:'That photo couldn’t be read. Try a different one.',session_expired:'Sign in to claude.ai again.',invalid_json:'Couldn’t read the estimate. Try again.',refused:'Claude couldn’t estimate that one. Try describing it instead.',empty_completion:'No estimate came back. Try again.'};

// Which exercise to open after finishing a set: the superset partner, else stay until it's done, else the next one with sets left.
function nextOpen(w,i){

// True when this exercise entry beats every earlier session of the same lift (same kind: weighted or bodyweight).
function isBest(b,name,date,id){const prev=bestOf(liftHistory(name,date,id).filter(x=>x.bw===b.bw));return !!prev&&b.v>prev.v+0.01}
function summary(w,id){
  const vol=volumeOf(w),prs=[];
  for(const e of w.ex){const b=bestSet(e);if(b&&isBest(b,e.n,w.date,id))prs.push(`${e.n} ${b.top}`)}
  const prev=Object.entries(S.workouts).filter(([oid,o])=>oid!==id&&o.prog===w.prog&&o.date<w.date&&trained(o)).sort((a,b)=>b[1].date.localeCompare(a[1].date))[0];
  const pv=prev?volumeOf(prev[1]):0,dv=pv?Math.round((vol/pv-1)*100):null;
  const mins=w.t0&&w.t1&&w.t1>w.t0?Math.round((w.t1-w.t0)/6e4):null;
  return `<div class="banner"><b>Workout finished ✓</b><div>Total volume: ${fmt(vol)} lbs${dv!=null?` (${dv>=0?'+':''}${dv}% vs ${short(prev[1].date)})`:''}${mins&&mins<300?` · ${mins} min`:''}</div>${prs.length?`<div class="good">New bests: ${prs.map(esc).join(', ')}</div>`:''}</div>`;

function weightSeries(){
  const end=today(),start=addDays(end,-89),dots=[],avgp=[];
  for(let i=0;i<90;i++){const k=addDays(start,i),w=num(S.days[k]&&S.days[k].weight);if(w)dots.push([i,w]);
    const win=[];for(let j=0;j<7;j++){const v=num(S.days[addDays(k,-j)]&&S.days[addDays(k,-j)].weight);if(v)win.push(v)}if(win.length>=3&&w)avgp.push([i,avg(win)])}
  return {dots,avgp,start,end};
}
function win(endKey,n,f){const out=[];for(let i=0;i<n;i++){const d=S.days[addDays(endKey,-i)];if(!d)continue;const v=f(d);if(v!=null&&!isNaN(v))out.push(v)}return out}
// Calories added to (or taken off) maintenance for each goal. Used by the intake and when switching phase.
const GOAL_ADJ={bulk:250,cut:-400,maintain:0};
// The 7-day average up to `end` against the 7 days before it, and what that means for the current goal.
// Returns {A,B,ch,ok,text,adj}: adj is the calorie change to suggest (+150, −150 or 0).
function weightTrend(end){
  const wv=d=>num(d.weight),a=win(end,7,wv),b=win(addDays(end,-7),7,wv),A=avg(a),B=avg(b),g=goalOf();
  const o={A,B,ch:null,ok:null,adj:0,text:'Weigh in at least 3 mornings a week (after the bathroom, before eating) to see your trend.'};
  if(a.length<3||b.length<3)return o;
  const ch=o.ch=A-B,say=(ok,text,adj=0)=>Object.assign(o,{ok,text,adj});
  if(g==='cut'){const loss=-ch,lo=A*0.005,hi=A*0.01;
    if(loss<lo*0.6)return say(false,`${ch>0?'Gaining':'Losing'} ${r1(Math.abs(ch))} lbs/wk. The target is ${r1(lo)}–${r1(hi)} lbs/wk. Eat about 150 cal less a day.`,-150);
    if(loss>hi*1.25)return say(false,`Losing ${r1(loss)} lbs/wk. That’s too fast, so you’ll lose more muscle. Eat about 150 cal more a day.`,150);
    return say(true,`Losing ${r1(loss)} lbs/wk. You’re on track.`)}
  if(g==='maintain'){
    if(ch>0.3)return say(false,`Up ${r1(ch)} lbs this week. Eat about 150 cal less a day if it keeps climbing.`,-150);
    if(ch<-0.3)return say(false,`Down ${r1(-ch)} lbs this week. Eat about 150 cal more a day if it keeps dropping.`,150);
    return say(true,`Weight is steady (${ch>=0?'+':''}${r1(ch)} lbs). You’re on track.`)}
  if(ch<0.15)return say(false,`Gaining ${r1(ch)} lbs/wk. That’s below the 0.25–0.5 target. Add about 150 cal a day.`,150);

// ---------- goal phases ----------
// Pace in lbs/week over the last 3 weeks (steadier than one week), falling back to the last week.
function pace(){
  const td=today(),wv=d=>num(d.weight),now=win(td,7,wv),then=win(addDays(td,-21),7,wv);
  if(now.length>=3&&then.length>=3)return (avg(now)-avg(then))/3;

}
// "At this pace you reach 173 lbs around Feb 20", or '' when there's no goal to move toward or no clear pace.
function etaText(){
  const g=goalOf(),A=weightTrend(today()).A,goal=T().goal,rate=pace();
  if(g==='maintain'||!A||rate==null)return '';
  const gap=goal-A;if(g==='bulk'?gap<=0:gap>=0)return '';
  if(Math.sign(rate)!==Math.sign(gap)||Math.abs(rate)<0.05)return '';
  const wks=gap/rate;if(wks>78)return '';
  return `At this pace you reach ${goal} lbs around ${parseKey(addDays(today(),Math.round(wks*7))).toLocaleDateString(undefined,{month:'short',day:'numeric'})}.`;
}
const goalReached=()=>{const g=goalOf(),A=weightTrend(today()).A,goal=T().goal;return !!A&&(g==='bulk'?A>=goal:g==='cut'?A<=goal:false)};
// What can come next once the goal weight is reached, with targets worked out from the current ones.
function nextPhases(){
  const t=T(),A=Math.round(weightTrend(today()).A),g=goalOf(),maint=t.cal-GOAL_ADJ[g],r50=v=>Math.round(v/50)*50,pro=m=>Math.min(220,Math.round(A*m/5)*5);
  if(g==='bulk')return [
    {goal:'cut',label:'Start a mini-cut',why:'6–8 weeks to lean out, then bulk again.',cal:Math.max(1600,r50(maint+GOAL_ADJ.cut)),pro:pro(1),gw:Math.round(A*0.95)},
    {goal:'bulk',label:'Keep bulking',why:'Stay on the same calories and aim higher.',cal:t.cal,pro:t.pro,gw:t.goal+5}];
  return [
    {goal:'maintain',label:'Hold this weight',why:'Eat at maintenance and keep getting stronger.',cal:r50(maint),pro:pro(0.9),gw:A},
    {goal:'bulk',label:'Start a lean bulk',why:'Add muscle at 0.25–0.5 lb a week.',cal:r50(maint+GOAL_ADJ.bulk),pro:pro(0.9),gw:A+8}];
}

}

// ---------- weekly check-in ----------
// New bests set and lifts stalled between two dates. Shared by the check-in and "Lifts this week".
function liftsMoved(from,to){
  const up=[],stuck=[];
  for(const n of liftNames()){const hist=liftHistory(n,to),last=hist[hist.length-1];if(!last||last.date<addDays(to,-21))continue;

function muscleSets(end){

let DR=null;
app.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;const li=h.closest('.ritem');if(!li)return;e.preventDefault();DR={li,list:li.parentElement,id:e.pointerId};li.classList.add('dragging');try{h.setPointerCapture(e.pointerId)}catch(x){}});
app.addEventListener('pointermove',e=>{if(!DR||e.pointerId!==DR.id)return;e.preventDefault();const y=e.clientY;let before=null;
  for(const it of DR.list.children){if(it===DR.li)continue;const r=it.getBoundingClientRect();if(y<r.top+r.height/2){before=it;break}}
  if(before){if(before!==DR.li.nextElementSibling)DR.list.insertBefore(DR.li,before)}else if(DR.list.lastElementChild!==DR.li)DR.list.appendChild(DR.li)});
function endDrag(e){if(!DR||e.pointerId!==DR.id)return;const order=[...DR.list.children].map(x=>+x.dataset.ri);DR.li.classList.remove('dragging');DR=null;
  const w=curWorkout();if(order.length===w.ex.length&&!order.every((v,k)=>v===k)){w.ex=order.map(k=>w.ex[k]);putWorkout(w)}render()}

// ---------- Supabase data layer (same interface the tracker already uses) ----------
const CFG=window.GJ_CONFIG||{};
const SB=(window.supabase&&CFG.url&&CFG.key)?window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const AUTH_HASH=location.hash||'';
const NEEDS_PW=/type=(invite|recovery)/.test(AUTH_HASH);
const ME={user:null,profile:null};
function dbErr(e){const st=e&&(e.status||e.code);if(st===401||st==='401'||st==='PGRST301'||st==='42501')return {code:'invalid_argument',message:String(e.message||e)};
  const msg=String((e&&e.message)||e);return {code:navigator.onLine===false||/failed to fetch|networkerror|load failed|network request failed/i.test(msg)?'offline':'unavailable',message:msg}}
function makeDb(uid){
  const L={days:[],workouts:[],settings:[]},timers={};
  const snapOf=rows=>{const docs=rows.map(r=>({id:r.id,exists:true,data:()=>r.data,metadata:{fromCache:false,hasPendingWrites:false}}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}};
  async function pull(coll){
    const {data,error}=await SB.from('docs').select('id,data').eq('coll',coll).limit(5000);
    if(error){for(const f of L[coll])f.err&&f.err(dbErr(error));return}
    const qs=snapOf(data||[]);for(const f of L[coll])f.next(qs);
  }
  const later=coll=>{clearTimeout(timers[coll]);timers[coll]=setTimeout(()=>pull(coll),250)};
  const pullAll=()=>{for(const c of Object.keys(L))if(L[c].length)later(c)};
  try{SB.channel('docs-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'user_id=eq.'+uid},p=>{const c=(p.new&&p.new.coll)||(p.old&&p.old.coll);if(c&&L[c])later(c);else pullAll()}).subscribe()}catch(e){}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullAll()});
  window.addEventListener('online',pullAll);
  const doc=path=>{const [coll,id]=path.split('/');return {
    id,path,
    async get(){const {data,error}=await SB.from('docs').select('data').eq('coll',coll).eq('id',id).maybeSingle();if(error)throw dbErr(error);return {id,exists:!!data,data:()=>data?data.data:undefined,metadata:{fromCache:false,hasPendingWrites:false}}},
    async set(d){const {error}=await SB.from('docs').upsert({user_id:uid,coll,id,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id,coll,id'});if(error)throw dbErr(error)},
    async update(p){const {error}=await SB.rpc('patch_doc',{p_coll:coll,p_id:id,p_patch:p});if(error)throw dbErr(error)},
    onSnapshot(next,err){L[coll].push({next:qs=>{const d=qs.docs.find(x=>x.id===id);next(d?{id,exists:true,data:d.data,metadata:qs.metadata}:{id,exists:false,data:()=>undefined,metadata:qs.metadata})},err});pull(coll);return ()=>{}}
  }};
  const collection=coll=>{const q={where:()=>q,orderBy:()=>q,limit:()=>q,doc:id=>doc(coll+'/'+id),onSnapshot(next,err){L[coll].push({next,err});pull(coll);return ()=>{}}};return q};
  return {doc,collection,pullAll};
}

async function saveName(){const v=($('#acname').value||'').trim().slice(0,40);const {error}=await SB.from('profiles').update({display_name:v}).eq('id',ME.user.id);S.nameMsg=error?'Couldn’t save the name.':'Saved ✓';if(!error&&ME.profile)ME.profile.display_name=v;render()}
async function changePassword(){const v=$('#acpw').value||'';if(v.length<8){S.pwMsg='Use at least 8 characters.';return render()}const {error}=await SB.auth.updateUser({password:v});S.pwMsg=error?(error.message||'Couldn’t change it.'):'Password changed ✓';render()}
async function signOut(){flushAll();await sleep(300);forgetCopy();try{await SB.auth.signOut()}catch(e){}location.replace(location.pathname)}

// ---------- automatic steps (an iOS Shortcut posts to log_steps with a personal token) ----------
async function loadStepLink(){try{const {data}=await SB.from('step_tokens').select('created_at,last_used').maybeSingle();S.stepLink=data||false}catch(e){S.stepLink=false}if(S.tab==='account')softRender()}
async function newStepLink(){const {data,error}=await SB.rpc('new_steps_token');if(error||!data){S.stepMsg='Couldn’t make the link. Try again in a minute.';return render()}S.stepMsg='';S.stepTok=data;S.stepLink={created_at:new Date().toISOString(),last_used:null};render()}
async function stopStepLink(){try{await SB.from('step_tokens').delete().eq('user_id',ME.user.id)}catch(e){}S.stepTok=null;S.stepLink=false;render()}
const copyRow=(label,v)=>`<label class="f" style="margin-top:8px">${label}<span class="row"><input readonly value="${esc(v)}" class="grow"><button class="small" type="button" data-act="cp" data-cp="${esc(v)}">Copy</button></span></label>`;
function stepsCard(){
  if(!ME.user)return '';
  if(S.stepLink===undefined){loadStepLink();return ''}
  let h=`<div class="card"><h2>Automatic steps</h2>`;
  if(S.stepTok)h+=`<p class="muted" style="margin-top:0">Set this up once on your iPhone. The token below is only shown now, so finish before you leave this page.</p>
    <ol class="plain" style="padding-left:20px">
     <li>Open the <b>Shortcuts</b> app, tap <b>+</b> and name the shortcut “Send steps”.</li>
     <li>Add <b>Find Health Samples</b>. Set the type to <b>Steps</b> and add the filter <b>Start Date is today</b>.</li>
     <li>Add <b>Calculate Statistics</b> and choose <b>Sum</b>.</li>
     <li>Add <b>Format Date</b> for the <b>Current Date</b>. Set Date Format to <b>Custom</b> and type <code>yyyy-MM-dd</code>.</li>
     <li>Add <b>Get Contents of URL</b>. Paste the URL below, set Method to <b>POST</b>, add a header named <code>apikey</code> with the key below, and set Request Body to <b>JSON</b> with three fields:
       <code>p_token</code> (Text, the token below), <code>p_steps</code> (Number, the Statistics result) and <code>p_date</code> (Text, the Formatted Date).</li>
     <li>Tap ▶ to test it. Your steps show up on Today within a few seconds.</li>
     <li>In the <b>Automation</b> tab, add a <b>Time of Day</b> automation (9:00 PM, daily, Run Immediately) that runs “Send steps”.</li>
    </ol>${copyRow('URL',CFG.url+'/rest/v1/rpc/log_steps')}${copyRow('apikey header',CFG.key)}${copyRow('p_token',S.stepTok)}
    <div class="row" style="margin-top:10px"><button class="small" data-act="stepdone">Done</button></div>`;
  else if(S.stepLink)h+=`<p class="muted" style="margin-top:0">Automatic steps are on. ${S.stepLink.last_used?'Last received '+new Date(S.stepLink.last_used).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'.':'Nothing received yet.'}</p>
    <div class="row wrap"><button class="small" data-act="stepnew">Make a new link</button><button class="small" data-act="stepoff">Turn off</button></div>
    <div class="muted" style="margin-top:6px">A new link stops the old Shortcut until you paste the new token into it.</div>`;
  else h+=`<p class="muted" style="margin-top:0">Have your iPhone send your Apple Health steps to the app every day, so you don’t have to type them. It takes about 5 minutes to set up in the Shortcuts app.</p><button class="small primary" data-act="stepnew">Set up automatic steps</button>`;
  if(S.stepMsg)h+=`<div class="err">${esc(S.stepMsg)}</div>`;
  return h+`</div>`;
}

// ---------- sign-in screens ----------
function authScreen(mode,msg){
  document.body.classList.add('signedout');
  const box=$('#auth');
  if(mode==='setpw'){
    box.innerHTML=`<div class="card"><h2>Set your password</h2><div class="muted">Pick a password you’ll use to sign in on your phone.</div>
     <form id="pwform"><label class="f">New password<input id="np1" type="password" autocomplete="new-password" required minlength="8"></label>
     <label class="f">Confirm password<input id="np2" type="password" autocomplete="new-password" required minlength="8"></label>
     <div class="err" id="aerr">${esc(msg||'')}</div><button class="primary" type="submit">Save password</button></form></div>`;
    $('#pwform').onsubmit=async e=>{e.preventDefault();const a=$('#np1').value,b=$('#np2').value;if(a!==b){$('#aerr').textContent='Passwords don’t match.';return}
      const {error}=await SB.auth.updateUser({password:a});if(error){$('#aerr').textContent=error.message||'Couldn’t save it.';return}
      history.replaceState(null,'',location.pathname);start()};
    return;
  }
  if(mode==='forgot'){
    box.innerHTML=`<div class="card"><h2>Reset password</h2><div class="muted">We’ll email you a link to set a new password.</div>
     <form id="fform"><label class="f">Email<input id="fem" type="email" autocomplete="email" required></label><div class="err" id="aerr">${esc(msg||'')}</div>
     <button class="primary" type="submit">Send link</button><button type="button" class="link" id="back">Back to sign in</button></form></div>`;
    $('#back').onclick=()=>authScreen('login');
    $('#fform').onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.resetPasswordForEmail($('#fem').value.trim(),{redirectTo:location.origin+location.pathname});
      $('#aerr').className=error?'err':'ok';$('#aerr').textContent=error?(error.message||'Couldn’t send it.'):'Check your email for the link.'};
    return;
  }
  box.innerHTML=`<div class="card"><h2>Get Jacked</h2><div class="muted">Sign in with the account you were given.</div>
   <form id="lform"><label class="f">Email<input id="lem" type="email" autocomplete="email" required></label>
   <label class="f">Password<input id="lpw" type="password" autocomplete="current-password" required></label>
   <div class="err" id="aerr">${esc(msg||'')}</div><button class="primary" type="submit" id="lbtn">Sign in</button>
   <button type="button" class="link" id="forgot">Forgot password?</button></form></div>`;
  $('#forgot').onclick=()=>authScreen('forgot');
  $('#lform').onsubmit=async e=>{e.preventDefault();$('#lbtn').disabled=true;$('#aerr').textContent='';
    const {error}=await SB.auth.signInWithPassword({email:$('#lem').value.trim(),password:$('#lpw').value});
    $('#lbtn').disabled=false;if(error){$('#aerr').textContent=error.message==='Invalid login credentials'?'Wrong email or password.':(error.message||'Couldn’t sign in.');return}
    start()};
}

// ---------- load ----------
function applySnap(snap,col,map){let ch=false;for(const d of snap.docs){S.known[col+'/'+d.id]=true;if(pending[col+'/'+d.id])continue;const s=JSON.stringify(d.data());if(JSON.stringify(map[d.id])!==s){map[d.id]=JSON.parse(s);ch=true}}return ch}
function onErr(e){if(S.loaded&&e&&e.code==='offline'){setStatus(Object.keys(pending).length?OFFLINE_SAVED:'Offline');return}S.note='Lost the connection to your saved data. It will retry when the app comes back into view.';setStatus('Offline');render()}
let STARTED=false;
async function start(){
  if(STARTED)return;
  let session=null,netErr=false;
  try{const r=await SB.auth.getSession();session=r.data&&r.data.session;netErr=!!r.error&&/fetch|network/i.test((r.error.name||'')+(r.error.message||''))}catch(e){netErr=true}
  // With no signal the sign-in can't be refreshed. If this phone was signed in, open its saved copy; nothing sends until it's back online.
  const user=session?session.user:((navigator.onLine===false||netErr)?LS.get('gj_last'):null);
  if(!user){S.boot=false;return authScreen('login')}
  if(NEEDS_PW&&!S.pwDone){S.pwDone=true;return authScreen('setpw')}
  STARTED=true;
  document.body.classList.remove('signedout');$('#auth').innerHTML='';
  ME.user=user;LS.set('gj_last',{id:user.id,email:user.email});
  S.sample=null;S.boot=false;
  const db=makeDb(ME.user.id);S.db=db;
  if(openCopy())setStatus(navigator.onLine===false?'Offline':'Syncing…');
  render();
  SB.from('profiles').select('display_name,is_admin').eq('id',ME.user.id).maybeSingle().then(({data})=>{if(data){ME.profile=data;keepCopy();meBadge()}},()=>{});
  const timer=setTimeout(()=>{if(!S.loaded){S.timedOut=true;S.note='Still connecting, so some saved data may be missing. Check your connection; it will fill in once it connects.';setStatus('Connecting…');render()}},10000);
  const got=k=>{S.ready[k]=true;keepCopy();if(!S.synced&&S.ready.days&&S.ready.workouts&&S.ready.settings){S.synced=S.loaded=true;clearTimeout(timer);if(S.note&&S.note.startsWith('Still'))S.note=null;if(!Object.keys(pending).length)setStatus('Saved ✓');keepCopy();render();checkPlan();queueBoard();return true}return false};
  db.collection('days').onSnapshot(s=>{const ch=applySnap(s,'days',S.days);if(!got('days')&&ch)softRender()},onErr);
  db.collection('workouts').onSnapshot(s=>{const ch=applySnap(s,'workouts',S.workouts);if(!got('workouts')&&ch)softRender()},onErr);
  db.doc('settings/main').onSnapshot(s=>{if(s.exists)S.known['settings/main']=true;let ch=false;if(!pending['settings/main']){const v=s.exists?s.data():{};if(JSON.stringify(v)!==JSON.stringify(S.settings)){S.settings=clone(v);ch=true}}if(!got('settings')&&ch)softRender()},onErr);
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(!SB){S.boot=false;S.note='App isn’t configured: check config.js.';render()}
else{
  SB.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'&&STARTED)location.replace(location.pathname)});
  start();
}
</script>
