name: Deploy

# The app itself deploys through Vercel's Git integration (main = production, branches = previews).
# This workflow handles the Supabase side after CI passes on main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  supabase:
    name: Supabase (migrations + auth settings)
    # Only run for CI on a real push to this repo's main branch (never for pull requests or forks),
    # or when started by hand from the Actions tab.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check required settings
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -n "$PROJECT_ID" ]            || missing="$missing SUPABASE_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing (Settings → Secrets and variables → Actions)"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply migrations
        run: supabase db push --yes --remote

      # Off by default: it needs an access token that also has the Edge Functions permission.
      # Turn it on by setting the repository variable DEPLOY_FUNCTIONS to true (README, "Optional features").
      - name: Deploy Edge Functions (photo estimates, reminders)
        if: ${{ vars.DEPLOY_FUNCTIONS == 'true' }}
        run: |
          supabase functions deploy food-estimate --project-ref "$PROJECT_ID"
          supabase functions deploy send-reminders --project-ref "$PROJECT_ID"

      - name: Auth settings (sign-ups off, site URL, redirect URLs)
        run: |
          if [ -z "$SITE_URL" ]; then
            body='{"disable_signup":true}'
            echo "::warning::SITE_URL variable not set; only turning off sign-ups."
          else
            body=$(jq -n --arg u "${SITE_URL%/}" '{disable_signup:true, site_url:$u, uri_allow_list:($u + "/**")}')
          fi
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body" > /dev/null
          echo "Auth settings updated."

      - name: Make admin (if ADMIN_EMAIL is set and the account exists)
        if: ${{ env.ADMIN_EMAIL != '' }}
        run: |
          body=$(jq -n --arg e "$ADMIN_EMAIL" '{query:"update public.profiles set is_admin = true where id = (select id from auth.users where lower(email) = lower($1)) and is_admin = false returning id", parameters:[$e]}')
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body" > /dev/null
          echo "Admin check done."
