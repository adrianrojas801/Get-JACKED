name: CI

on:
  pull_request:
    # "edited" re-runs the checks when a PR's title or description is changed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job shows up as its own line (✓ / ✗) in the PR's checks list. main's
# ruleset requires only "Merge gate", which passes when every other job passed.
# When you add a job, add it to the gate's `needs` list.

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the app's scripts, config.js and sw.js
        run: node tests/check_syntax.js | tee -a "$GITHUB_STEP_SUMMARY"

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Edge Functions
        run: deno check supabase/functions/*/index.ts

  sql:
    name: SQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pglast
      - name: Parse, RLS on every table, no anon grants, file naming
        run: |
          {
            echo "### SQL migrations"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          python tests/check_sql.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  db:
    name: Database rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest comes with PostgreSQL installed (not running). The test starts a throwaway copy.
      - name: Migrations re-run cleanly, RLS and functions behave
        run: python3 tests/check_db.py

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Sign-in, save, import, reload, all tabs
        run: python tests/smoke.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No secret keys committed
        run: |
          if grep -RInE "sb_secret_[A-Za-z0-9_-]{10,}|sk-ant-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\." --exclude-dir=.git --exclude-dir=vendor . ; then
            echo "::error::Possible secret found in the repo. Remove it and rotate the key."
            exit 1
          fi
          echo "No secret keys found." >> "$GITHUB_STEP_SUMMARY"

  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The repo owner doesn't want AI attribution in PR titles, PR descriptions or commit messages.
      # Some tools add a footer to a PR description on their own. This fails the PR so it can't be merged with one.
      - name: PR text and commit messages are clean
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by|claude-session|generated (by|with)|claude\.ai/code|noreply@anthropic\.com|🤖'
          bad=0
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -n -i -E "$pattern"; then
            echo "::error::The PR title or description has an AI attribution line. Edit the description on GitHub and delete it."
            bad=1
          fi
          if git log --format='%h %B' "$BASE_SHA..$HEAD_SHA" | grep -n -i -E "$pattern"; then
            echo "::error::A commit message has an AI attribution line. Fix it with a new commit; never rewrite pushed history."
            bad=1
          fi
          [ "$bad" = 0 ] && echo "No AI attribution found." >> "$GITHUB_STEP_SUMMARY"
          exit $bad

  gate:
    name: Merge gate
    if: always()
    needs: [syntax, functions, sql, db, smoke, secrets, attribution]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Merge gate"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' > /dev/null; then
            echo "::error::One or more checks did not pass. See the table in the summary."
            exit 1
          fi
          echo "All checks passed."
