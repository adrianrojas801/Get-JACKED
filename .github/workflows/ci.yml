name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, SQL and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          pip install pglast playwright
          python -m playwright install --with-deps chromium

      - name: JavaScript syntax
        run: node tests/check_syntax.js

      - name: SQL migrations (parse, RLS on every table, no anon grants)
        run: python tests/check_sql.py

      - name: Smoke test (sign-in, save, import, reload)
        run: python tests/smoke.py

      - name: No secrets committed
        run: |
          if grep -RInE "sb_secret_[A-Za-z0-9_-]{10,}|sk-ant-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\." --exclude-dir=.git --exclude-dir=vendor . ; then
            echo "::error::Possible secret found in the repo. Remove it and rotate the key."
            exit 1
          fi
